[project]
name = "course-work-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Maxim",email = "mcsim55555k@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pip (>=26.0.1,<27.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "xlsxwriter (>=3.2.9,<4.0.0)"
]

[tool.poetry]
packages = [{include = "course_work_1", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.20.1,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''.git'''

[tool.isort]
# Максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '''.venv'''
